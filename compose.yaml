# Steam Release Calendar — Dockge stack
#
# Put these in this stack's .env file (Dockge has an editor for it):
#   STEAM_ACCOUNT=your-vanity-name      # or a steamID64, or a profile URL
#   STEAM_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   TZ=Europe/Budapest
#
# The image is built and published by .github/workflows/build.yml on every push
# to main, so updating is `docker compose pull && docker compose up -d` — or the
# Update button in Dockge. No build context needed on the server.
#
# The package is public, so the server pulls it anonymously — no docker login.

services:
  releasecalendar:
    image: ghcr.io/lovasz-akos/releasecalendar:latest

    # To build locally instead of pulling, uncomment this and run
    # `docker compose up -d --build`:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: releasecalendar
    restart: unless-stopped

    ports:
      - "5080:8080"

    environment:
      # A vanity name, a steamID64, or a pasted profile URL — all three work.
      # The wishlist half needs no API key, just a public wishlist.
      Calendar__Account: "${STEAM_ACCOUNT:?set STEAM_ACCOUNT in the stack .env}"

      # Read from the stack .env so the key never sits in the compose text.
      Calendar__ApiKey: "${STEAM_API_KEY:?set STEAM_API_KEY in the stack .env}"

      Calendar__SyncIntervalHours: "6"
      Calendar__CountryCode: "US"
      Calendar__Language: "english"
      Calendar__RecentlyReleasedDays: "180"

      # Lives on the named volume below, so pulling a new image keeps the delay
      # history — the one thing that cannot be refetched from Steam.
      Calendar__DatabasePath: "/data/calendar.db"

      # Only affects log timestamps; release dates are handled as plain dates.
      TZ: "${TZ:-UTC}"

    volumes:
      - releasecalendar-data:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  releasecalendar-data:
